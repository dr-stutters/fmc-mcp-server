# Test override: two mocked FMCs ("default" and "dr") and a throwaway token, no real FMC needed.
#   docker compose -f docker-compose.yml -f docker-compose.mock.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.mock.yml exec fmc-mcp-server fmc-mcp-server check
#   curl -k https://localhost:8443/health
# The mocks speak plain HTTP, so check warns about it; never use these values for a real deployment.
services:
  fmc-mcp-server:
    environment:
      FMC_URL: http://fmc-a:8080
      FMC_USERNAME: mcp-api-ro
      FMC_PASSWORD: mock-password
      FMC_INSTANCES: dr
      FMC_DR_URL: http://fmc-b:8080
      FMC_DR_USERNAME: mcp-api-ro
      FMC_DR_PASSWORD: mock-password
      # token "mock-alice-token" (sha256 below): for this demo only
      MCP_AUTH_TOKENS: alice:sha256:049308f729cc1bfad7f268a823b2dbe01c91fc414963c1357de2d5fa036599cb
    depends_on:
      - fmc-a
      - fmc-b
  caddy:
    ports: !override
      - "${MCP_HTTPS_PORT:-8443}:443"
  fmc-a:
    image: python:3.12-slim
    command: ["python", "/mock/appliance.py", "/mock/routes.json", "8080", "fmc-a"]
    volumes:
      - ./mock:/mock:ro
  fmc-b:
    image: python:3.12-slim
    command: ["python", "/mock/appliance.py", "/mock/routes.json", "8080", "fmc-b"]
    volumes:
      - ./mock:/mock:ro
