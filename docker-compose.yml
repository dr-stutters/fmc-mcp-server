# fmc-mcp-server: docker compose for one FMC (host port 8035). Shared hosts: docs/deploying.md.
#
#   cp .env.example .env && chmod 600 .env   # FMC_URL/USERNAME/PASSWORD and MCP_AUTH_TOKENS (one token per person)
#   docker compose up -d            # pulls ghcr.io/dr-stutters/fmc-mcp-server (MCP_IMAGE_TAG, default latest)
#   docker compose up -d --build    # or build from this checkout (MCP_PULL_POLICY=build keeps the local image)
#
# Read-only unless .env sets MCP_ENABLE_WRITES=true (and MCP_ENABLE_DANGEROUS=true for deploys, device/HA
# changes and policy deletes).
services:
  fmc-mcp-server:
    image: ghcr.io/dr-stutters/fmc-mcp-server:${MCP_IMAGE_TAG:-latest}
    pull_policy: ${MCP_PULL_POLICY:-always}
    build:
      context: .
    container_name: fmc-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      # The container's own FMC user (docs/least-privilege.md): FMC allows one session per user, so it
      # must not share FMC_USERNAME with the CLI or the live tests. Falls back to FMC_USERNAME.
      FMC_USERNAME: ${FMC_SVC_USERNAME:-${FMC_USERNAME}}
      FMC_PASSWORD: ${FMC_SVC_PASSWORD:-${FMC_PASSWORD}}
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MCP_CACHE_DIR: /cache
    ports:
      - "${MCP_PUBLISH_PORT:-8035}:8000"
    volumes:
      - spec-cache:/cache
      # fmc_import_certificate_files / fmc_create_cert_enrollment: mount a host directory of PEM / PKCS12
      # files read-only and set FMC_PKI_DIR=/pki
      # in .env. The container runs as uid 10001: make the keys readable by that uid only (chown 10001, chmod 600).
      # - /srv/fmc-pki:/pki:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  spec-cache:
