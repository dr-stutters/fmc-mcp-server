# fmc-mcp-server on cortex: host port 8035 -> container 8000.
#
#   cp .env.example .env    # set FMC_URL/USERNAME/PASSWORD and MCP_AUTH_TOKENS (fmc-mcp-server token <name>)
#   docker compose up -d --build
services:
  fmc-mcp-server:
    build:
      context: .
    image: fmc-mcp-server:latest
    container_name: fmc-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      # The container's own FMC user (docs/least-privilege.md): FMC allows one session per user, so it
      # must not share FMC_USERNAME with the CLI or the live tests. Falls back to FMC_USERNAME.
      FMC_USERNAME: ${FMC_SVC_USERNAME:-${FMC_USERNAME}}
      FMC_PASSWORD: ${FMC_SVC_PASSWORD:-${FMC_PASSWORD}}
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MCP_CACHE_DIR: /cache
      MCP_ENABLE_WRITES: "true"
      MCP_ENABLE_DANGEROUS: "false"
    ports:
      - "${MCP_PUBLISH_PORT:-8035}:8000"
    volumes:
      - spec-cache:/cache
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  spec-cache:
