[project]
name = "fmc-mcp-server"
version = "0.11.0"
description = "MCP server for Cisco Secure Firewall Management Center (FMC)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
    # >>> bundled stutters-mcp-core v0.13.0 (scripts/bundle_core.py; do not edit)
    "fastmcp>=4.1,<5",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "tzdata>=2025.2",
    "uvicorn>=0.30",
    # <<< bundled stutters-mcp-core
]

[project.scripts]
fmc-mcp-server = "fmc_mcp:main"

# stutters-mcp-core is bundled into the package as fmc_mcp._core (ADR-005 in stutters-mcp-core):
# python scripts/bundle_core.py vendor   (after a clone or a pin change; then uv lock if deps changed)
[tool.bundle-core]
tag = "v0.13.0"
commit = "7614e24f1b5ec26e7706df8a7a123fee5c67a0bb"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fmc_mcp"

[dependency-groups]
dev = [
    "ldap3>=2.9.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests/unit"]
markers = ["live: needs the lab appliance (skipped when unreachable)"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["fmc_mcp._core", "fmc_mcp._core.*"]   # bundled core: checked in stutters-mcp-core's own CI
ignore_errors = true
